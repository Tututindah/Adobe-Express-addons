<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Font & Color AI Checker</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    button {
      background: #4e5bf9;
      color: white; padding: 10px 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 12px;
    }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .recommendation-card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 0 6px rgba(0,0,0,0.1);
      padding: 12px;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>
  <button id="checkDesign" disabled>Check Font & Color Harmony (AI)</button>
  <button id="autofixFont" style="display:none;">🔧 Auto Fix Font</button>
  <div id="result">Loading...</div>
  <script type="module" src="ui/index.js"></script>
</body>
</html>
